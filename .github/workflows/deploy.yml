name: Deploy Nuxt 3 to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Nuxt
        env:
          NUXT_PUBLIC_IMPORT_SECRET: ${{ secrets.NUXT_PUBLIC_IMPORT_SECRET }}
        run: |
          npm ci
          npx nuxi generate

      - name: Sync Output Files to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: / 