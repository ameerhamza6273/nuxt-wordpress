name: Deploy Nuxt 3 to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies & Build Nuxt
      run: |
        npm ci
        npx nuxi generate

    - name: Sync Output Files to HostGator
      uses: SamKirsch/ftp-deploy-action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: .output/public/
        server-dir: /
        state-name: .ftp-deploy-sync-state.json